name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Org CI contract: lint → build (install) → test. Deploy remains deploy.yml on main.
concurrency:
  group: loopforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q src backend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + golden registry
        run: |
          pip install -e ".[dev]"
          pip install -e ./golden-eval-registry
      - name: Import smoke
        run: |
          python -c "from backend.app.main import app; print('app', app.title)"
          python -c "from loop_engine.graph.build import run_agent_loop; print('graph ok', run_agent_loop)"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vpeetla-ai/golden-eval-registry
          path: golden-eval-registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]"
          pip install -e ./golden-eval-registry
      - name: Pytest (includes golden eval gates)
        env:
          GOLDEN_EVAL_REGISTRY_PATH: ${{ github.workspace }}/golden-eval-registry
        run: pytest -q

  ci-ok:
    name: CI gate
    needs: [lint, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require lint + build + test
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
